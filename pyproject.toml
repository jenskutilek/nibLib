[project]
name = "nibLib"
version = "0.1.3"
description = "Nib simulation for font editors"

readme = "README.md"
# license = "proprietary"

authors = [{ name = "Jens Kutílek", email = "webmail@kutilek.de" }]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]

requires-python = ">=3.11"
dependencies = [
  "beziers >= 0.6.0",
  "defconappkit @ git+https://github.com/robotools/defconAppKit.git",
  "fontpens >= 0.4.0",
  "fonttools >= 4.39.2",
]

[project.urls]
"Bug Tracker" = "https://github.com/jenskutilek/nibLib/issues"
"Documentation" = "hhttps://github.com/jenskutilek/nibLib/blob/master/README.md"
"Homepage" = "https://github.com/jenskutilek/nibLib"
# "Changelog" = "https://github.com/jenskutilek/nibLib/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
  "mypy >= 2.3.1",
  "ruff >= 0.16.5",
]
test = [
  "pytest-cov >= 7.1.0",
  "pytest >= 9.1.1",
  "tox-gh >= 1.8.0",
  "tox-uv >= 1.36.0",
  "tox >= 4.61.2",
  { include-group = "dev" },
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
cache_dir = "build/tests/pytest_cache"
# addopts = "--mypy --pylint --black --isort --cov --cov-report=term --cov-report=html --cov-report=xml"
testpaths = ["tests", "src"]  # "src" required for pylint and mypy (whereas cov considers imported files)

[tool.ruff]
extend-exclude = ["scripts"]

[tool.ruff.lint.isort]
known-first-party = ["nibLib"]

[tool.uv.build-backend]
# We need the module name because of mixed case
module-name = "nibLib"
