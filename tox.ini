[tox]
envlist =
    clean
    lint
    py31{1,4,5}
    ; mypy
    htmlcov
skip_missing_interpreters = true

[tool:pytest]
testpaths =
    tests
addopts = 
    --cov-report=term-missing

[gh]
python =
    3.11 = py311
    3.14 = py314, htmlcov # , mypy
    3.15 = py315

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    test
; extras =
;     all
commands =
    coverage run --parallel-mode -m pytest --ignore=tests/data {posargs}

[testenv:mypy]
runner = uv-venv-lock-runner
setenv =
    MYPYPATH = {toxinidir}/stubs
commands =
    mypy {posargs:src}

[testenv:lint]
description: Check import order and code formatting
runner = uv-venv-lock-runner
skip_install = true
commands =
    ruff check --select I  # Check import order
    ruff format --check --diff  # Check formatting

[testenv:htmlcov]
description: Report coverage over all test runs
skip_install = true
commands =
    coverage combine
    coverage report
    coverage html

[testenv:clean]
skip_install = true
commands =
    coverage erase
